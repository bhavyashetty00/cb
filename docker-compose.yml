version: '3.9'

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: eis

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - WHISPER_MODEL=base
      - AI_PORT=5001
    volumes:
      - ./ai-service:/app

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/eis
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_PIN=${ADMIN_PIN}
      - AI_SERVICE_URL=http://ai-service:5001
      - FRONTEND_URL=http://localhost:5173
      - AUDIO_STORAGE_PATH=/recordings
    volumes:
      - ./backend:/app
      - recordings:/recordings
      - /app/node_modules
    depends_on:
      - mongodb
      - ai-service

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  recordings:
